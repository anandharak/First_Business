<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QROrder PRO — Live Smart Order Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-glow: rgba(249, 115, 22, 0.25);
      --secondary: #8b5cf6;
      --secondary-glow: rgba(139, 92, 246, 0.25);
      --emerald: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
    }
    .glow-orange { top: -100px; left: -100px; background: #f97316; }
    .glow-purple { bottom: -100px; right: -100px; background: #8b5cf6; }

    /* Top Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(7, 11, 20, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 1.25rem;
      color: #fff;
      cursor: pointer;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--primary), #d97706);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 6px;
      color: #fff;
      font-weight: 800;
    }
    .role-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    .role-toggle:hover {
      border-color: var(--primary);
      color: #fff;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #ea580c);
      color: #fff;
      box-shadow: 0 4px 16px var(--primary-glow);
    }
    .btn-primary:hover { background: linear-gradient(135deg, #fb923c, #ea580c); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
    .btn-emerald {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .btn-emerald:hover { background: rgba(16, 185, 129, 0.25); }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      position: relative;
      z-index: 1;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .product-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(249, 115, 22, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    .product-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #1e293b;
    }
    .product-info {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .diet-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
    }
    .diet-veg { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .diet-nonveg { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Modals & Drawers */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Inputs */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    /* Cart Floating Drawer */
    .cart-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%;
      max-width: 420px;
      background: #0d1527;
      border-left: 1px solid var(--card-border);
      box-shadow: -10px 0 50px rgba(0, 0, 0, 0.6);
      z-index: 1050;
      display: flex;
      flex-direction: column;
      padding: 20px;
      animation: slideInRight 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

    /* Order status pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-received { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-preparing { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
    .status-ready { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-completed { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-orange"></div>
  <div class="ambient-glow glow-purple"></div>

  <!-- Header -->
  <header>
    <div class="nav-inner">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div class="brand" onclick="openProfile()">
          <span style="font-size: 1.4rem;">⚡</span>
          <span>QROrder</span>
          <span class="brand-badge">LIVE PRO</span>
        </div>
        <button class="role-toggle" id="roleToggleBtn" onclick="toggleRole()">
          <span id="roleBadgeText">🛍️ Customer Mode</span>
          <span style="font-size: 0.72rem; color: #64748b;">⇄ Switch</span>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="btn btn-secondary" onclick="openProfile()" id="navProfileBtn">
          <span>👤 Profile</span>
        </button>
        <button class="btn btn-primary" onclick="openCart()" id="navCartBtn" style="position: relative;">
          <span>🛒 Cart</span>
          <span id="cartCountBadge" style="background:#fff; color:var(--primary); font-size:0.7rem; padding:1px 6px; border-radius:10px; font-weight:800; display:none;">0</span>
        </button>
        <button class="btn btn-emerald" onclick="openAddShopModal()" id="navAddShopBtn" style="display: none;">
          <span>+ Register Store</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Router -->
  <main id="appContainer">
    <!-- Rendered dynamically by JavaScript -->
  </main>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="cart-drawer" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px;">
      <h3 style="font-size: 1.2rem; font-weight: 800;">Your Cart</h3>
      <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItemsList" style="flex: 1; overflow-y: auto; margin-bottom: 16px;"></div>
    <div id="cartFooter"></div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal-overlay" style="display: none;" onclick="closeProfile()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div id="profileAvatar" style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #ea580c); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800;">👤</div>
          <div>
            <h3 id="profileNameDisplay" style="font-size: 1.15rem; font-weight: 800;">Guest User</h3>
            <span id="profileRoleBadge" class="status-badge status-preparing" style="font-size: 0.7rem;">Customer Mode</span>
          </div>
        </div>
        <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="closeProfile()">✕</button>
      </div>

      <!-- Quick Role Switcher Banner (Zero Compulsion) -->
      <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Role Toggle</div>
          <div id="profileRoleHint" style="font-size: 0.85rem; font-weight: 600; color: #fff;">Switch between ordering and managing stores</div>
        </div>
        <button class="btn btn-primary" onclick="toggleRole()" style="font-size: 0.8rem; padding: 6px 12px;">⇄ Switch Role</button>
      </div>

      <!-- Identity Form -->
      <form onsubmit="saveProfile(event)" style="margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="profileInputName" class="form-input" placeholder="e.g. Rahul Sharma" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="profileInputPhone" class="form-input" placeholder="e.g. 9876543210" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
      </form>

      <!-- Customer Orders / Owner Stores -->
      <div id="profileSectionDetails"></div>
    </div>
  </div>

  <!-- Store Registration Modal -->
  <div id="addShopModal" class="modal-overlay" style="display: none;" onclick="closeAddShopModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.2rem; font-weight: 800;">🏪 Register Your Store</h3>
        <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="closeAddShopModal()">✕</button>
      </div>
      <form onsubmit="createShop(event)">
        <div class="form-group">
          <label class="form-label">Store / Restaurant Name *</label>
          <input type="text" id="shopNameInput" class="form-input" placeholder="e.g. Spice Symphony Cafe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="shopCategoryInput" class="form-input">
            <option value="food">🍽️ Restaurant & Cafe</option>
            <option value="grocery">🛒 Grocery & Daily Essentials</option>
            <option value="clothing">👗 Fashion & Apparel</option>
            <option value="electronics">⚡ Electronics & Gadgets</option>
            <option value="other">🏪 General Store</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tagline</label>
          <input type="text" id="shopTaglineInput" class="form-input" placeholder="Authentic Indian delicacies & coffee">
        </div>
        <div class="form-group">
          <label class="form-label">Contact Phone</label>
          <input type="tel" id="shopPhoneInput" class="form-input" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label class="form-label">UPI ID for Payments</label>
          <input type="text" id="shopUpiInput" class="form-input" placeholder="store@upi">
        </div>
        <div class="form-group">
          <label class="form-label">Table Count</label>
          <input type="number" id="shopTableCountInput" class="form-input" value="10" min="0">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Create Store & Generate QR</button>
      </form>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="addProductModal" class="modal-overlay" style="display: none;" onclick="closeAddProductModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.2rem; font-weight: 800;">Add Menu Item</h3>
        <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="closeAddProductModal()">✕</button>
      </div>
      <form onsubmit="addProduct(event)">
        <div class="form-group">
          <label class="form-label">Item Name *</label>
          <input type="text" id="prodNameInput" class="form-input" placeholder="e.g. Paneer Butter Masala" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Price (₹) *</label>
            <input type="number" id="prodPriceInput" class="form-input" placeholder="240" required min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Dietary</label>
            <select id="prodDietaryInput" class="form-input">
              <option value="veg">🌱 Pure Veg</option>
              <option value="non-veg">🍗 Non-Veg</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <input type="text" id="prodCategoryInput" class="form-input" placeholder="e.g. Starters, Main Course, Drinks">
        </div>
        <div class="form-group">
          <label class="form-label">Preparation Time</label>
          <input type="text" id="prodPrepTimeInput" class="form-input" placeholder="e.g. 15-20 min">
        </div>
        <div class="form-group">
          <label class="form-label">Image URL</label>
          <input type="url" id="prodImageInput" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Add Item to Live Menu</button>
      </form>
    </div>
  </div>

  <!-- QR Standee Modal -->
  <div id="qrModal" class="modal-overlay" style="display: none;" onclick="closeQrModal()">
    <div class="modal-box" onclick="event.stopPropagation()" style="text-align: center;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.15rem; font-weight: 800;">Store QR Standee</h3>
        <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="closeQrModal()">✕</button>
      </div>
      <div style="background: #fff; padding: 20px; border-radius: 16px; display: inline-block; margin-bottom: 16px;">
        <img id="qrImageTag" src="" alt="Store QR" style="width: 220px; height: 220px; display: block;">
        <div id="qrStoreTitle" style="color: #0f172a; font-weight: 800; margin-top: 10px; font-size: 1rem;">Store QR</div>
        <div style="color: #64748b; font-size: 0.75rem;">Scan to browse menu & order</div>
      </div>
      <div>
        <a id="qrDownloadBtn" href="" download="store_qr.png" class="btn btn-primary" style="text-decoration: none;">⬇️ Download QR Standee</a>
      </div>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="toast"></div>

  <script>
    // -------------------------------------------------------------
    // STATE & LOCAL STORAGE
    // -------------------------------------------------------------
    let currentRole = localStorage.getItem('qr_role') || 'customer'; // 'customer' or 'owner'
    let currentShopId = localStorage.getItem('qr_active_shop') || '';
    let userProfile = JSON.parse(localStorage.getItem('qr_profile') || '{"name":"Guest Customer","phone":""}');
    let cart = [];
    let liveShops = [];
    let liveProducts = [];
    let liveOrders = [];

    // Synthesized Audio chime
    function playAudio(type = 'click') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
        } else {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
        }
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    function showToast(msg) {
      playAudio('success');
      const t = document.getElementById('toast');
      t.innerHTML = `<span>⚡</span><span>${msg}</span>`;
      t.style.display = 'flex';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    // Role switcher (No compulsion)
    function toggleRole() {
      currentRole = currentRole === 'customer' ? 'owner' : 'customer';
      localStorage.setItem('qr_role', currentRole);
      updateHeader();
      renderApp();
      showToast(`Switched to ${currentRole === 'owner' ? '🏪 Shop Owner Mode' : '🛍️ Customer Mode'}`);
    }

    function updateHeader() {
      const isOwner = currentRole === 'owner';
      document.getElementById('roleBadgeText').innerText = isOwner ? '🏪 Owner Mode' : '🛍️ Customer Mode';
      document.getElementById('navAddShopBtn').style.display = isOwner ? 'inline-flex' : 'none';
      document.getElementById('navCartBtn').style.display = isOwner ? 'none' : 'inline-flex';
      const name = userProfile.name ? userProfile.name.split(' ')[0] : 'Profile';
      document.getElementById('navProfileBtn').innerHTML = `<span>👤 ${name}</span>`;
    }

    // -------------------------------------------------------------
    // LIVE DATA FETCHING
    // -------------------------------------------------------------
    async function loadShops() {
      try {
        const res = await fetch('/api/shops');
        liveShops = await res.json();
        if (!currentShopId && liveShops.length > 0) {
          currentShopId = liveShops[0].id;
          localStorage.setItem('qr_active_shop', currentShopId);
        }
      } catch(e) {
        console.error('Fetch error:', e);
      }
    }

    async function loadProducts(shopId) {
      if (!shopId) return;
      try {
        const res = await fetch(`/api/shops/${shopId}/products`);
        liveProducts = await res.json();
      } catch(e) {
        console.error(e);
      }
    }

    async function loadOrders(shopId) {
      if (!shopId) return;
      try {
        const res = await fetch(`/api/shops/${shopId}/orders`);
        liveOrders = await res.json();
      } catch(e) {
        console.error(e);
      }
    }

    // -------------------------------------------------------------
    // RENDER MAIN APPLICATION
    // -------------------------------------------------------------
    async function renderApp() {
      await loadShops();
      const container = document.getElementById('appContainer');

      // Check if URL has ?shop=
      const urlParams = new URLSearchParams(window.location.search);
      const urlShop = urlParams.get('shop');
      if (urlShop) {
        currentShopId = urlShop;
      }

      const activeShop = liveShops.find(s => s.id === currentShopId) || liveShops[0];

      if (currentRole === 'owner') {
        renderOwnerDashboard(container, activeShop);
      } else {
        renderCustomerStorefront(container, activeShop);
      }
    }

    // ── CUSTOMER VIEW ─────────────────────────────────────────
    async function renderCustomerStorefront(container, shop) {
      if (!shop) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 60px 20px; max-width: 520px; margin: 40px auto;">
            <div style="font-size: 3rem; margin-bottom: 12px;">🏪</div>
            <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 10px;">No Live Stores Yet</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px;">
              No shops have been registered in the platform yet. Switch to <strong>Shop Owner Mode</strong> to create your live store in 30 seconds and generate table QR standees!
            </p>
            <div style="display: flex; gap: 12px; justify-content: center;">
              <button class="btn btn-primary" onclick="toggleRole()">🏪 Switch to Shop Owner Mode</button>
            </div>
          </div>
        `;
        return;
      }

      await loadProducts(shop.id);

      container.innerHTML = `
        <!-- Store Banner & Info -->
        <div class="card" style="margin-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
          <div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <h1 style="font-size: 1.8rem; font-weight: 800; color: #fff;">${shop.name}</h1>
              <span class="status-badge ${shop.is_open ? 'status-ready' : 'status-completed'}">${shop.is_open ? '🟢 Open Now' : '🔴 Closed'}</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">${shop.tagline || 'Scan & Order Live'}</p>
            <div style="color: #64748b; font-size: 0.78rem; margin-top: 6px;">📍 ${shop.address || 'Table Service'} • 📞 ${shop.phone || 'Store Phone'}</div>
          </div>

          <div style="display: flex; gap: 10px;">
            ${liveShops.length > 1 ? `
              <select onchange="changeShop(this.value)" class="form-input" style="padding: 7px 12px; font-size: 0.82rem; width: auto;">
                ${liveShops.map(s => `<option value="${s.id}" ${s.id === shop.id ? 'selected' : ''}>🏪 ${s.name}</option>`).join('')}
              </select>
            ` : ''}
            <button class="btn btn-secondary" onclick="showStoreQr('${shop.id}', '${shop.name}')">📱 Table QR</button>
          </div>
        </div>

        <!-- Menu Section -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
          <h2 style="font-size: 1.3rem; font-weight: 800;">Live Menu (${liveProducts.length})</h2>
          <div style="font-size: 0.82rem; color: var(--text-muted);">✨ Live prices & instant kitchen orders</div>
        </div>

        ${liveProducts.length === 0 ? `
          <div class="card" style="text-align: center; padding: 40px 20px;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🍽️</div>
            <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Menu is being prepared</h3>
            <p style="color: var(--text-muted); font-size: 0.84rem;">The store owner hasn't added dishes to this menu yet.</p>
          </div>
        ` : `
          <div class="grid">
            ${liveProducts.map(p => `
              <div class="product-card">
                <img src="${p.image_url}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'">
                <div class="product-info">
                  <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                      <span class="diet-badge ${p.dietary === 'veg' ? 'diet-veg' : 'diet-nonveg'}">${p.dietary === 'veg' ? '🌱 VEG' : '🍗 NON-VEG'}</span>
                      <span style="font-size: 0.72rem; color: #64748b;">⏱️ ${p.prep_time}</span>
                    </div>
                    <h3 style="font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 4px;">${p.name}</h3>
                    <p style="font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px;">${p.description || p.category}</p>
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <div style="font-size: 1.15rem; font-weight: 800; color: #fff;">${shop.currency}${p.price}</div>
                    <button class="btn btn-primary" onclick="addToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price})" style="padding: 6px 14px; font-size: 0.82rem;">+ Add</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    // ── OWNER DASHBOARD ───────────────────────────────────────
    async function renderOwnerDashboard(container, shop) {
      if (!shop) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 60px 20px; max-width: 500px; margin: 40px auto;">
            <div style="font-size: 3rem; margin-bottom: 12px;">🏪</div>
            <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">Setup Your Store</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 24px;">
              Register your business now to generate table QR standees and manage incoming live kitchen orders.
            </p>
            <button class="btn btn-primary" onclick="openAddShopModal()">+ Register Store Now</button>
          </div>
        `;
        return;
      }

      await Promise.all([loadProducts(shop.id), loadOrders(shop.id)]);

      container.innerHTML = `
        <!-- Owner Control Bar -->
        <div class="card" style="margin-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
          <div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <h1 style="font-size: 1.7rem; font-weight: 800;">${shop.name}</h1>
              <span class="status-badge ${shop.is_open ? 'status-ready' : 'status-completed'}">${shop.is_open ? '🟢 Accepting Orders' : '🔴 Closed'}</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Owner Control Dashboard • Live Kitchen & Menu</p>
          </div>

          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="toggleStoreStatus('${shop.id}', ${!shop.is_open})">
              ${shop.is_open ? '⏸️ Pause Store' : '▶️ Open Store'}
            </button>
            <button class="btn btn-secondary" onclick="showStoreQr('${shop.id}', '${shop.name}')">📱 Store QR Standee</button>
            <button class="btn btn-emerald" onclick="openAddProductModal()">+ Add Menu Item</button>
          </div>
        </div>

        <!-- Live Orders Section -->
        <div style="margin-bottom: 32px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="font-size: 1.3rem; font-weight: 800;">Live Kitchen Orders (${liveOrders.length})</h2>
            <button class="btn btn-secondary" onclick="renderApp()" style="font-size: 0.78rem;">🔄 Refresh</button>
          </div>

          ${liveOrders.length === 0 ? `
            <div class="card" style="text-align: center; padding: 40px 20px;">
              <div style="font-size: 2.2rem; margin-bottom: 8px;">🔔</div>
              <h3 style="font-size: 1.05rem; margin-bottom: 4px;">No live orders right now</h3>
              <p style="color: var(--text-muted); font-size: 0.82rem;">When customers scan your QR standee and order, they appear here live.</p>
            </div>
          ` : `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
              ${liveOrders.map(o => `
                <div class="card" style="border-left: 4px solid ${o.status === 'received' ? '#3b82f6' : o.status === 'preparing' ? '#f97316' : '#10b981'};">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                    <div>
                      <div style="font-weight: 800; font-size: 1.1rem; color: #fff;">Order ${o.order_number}</div>
                      <div style="font-size: 0.76rem; color: var(--text-muted);">${o.table_or_address} • 👤 ${o.customer_name}</div>
                    </div>
                    <span class="status-badge status-${o.status}">${o.status.toUpperCase()}</span>
                  </div>

                  <div style="background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; margin-bottom: 14px;">
                    ${o.items.map(it => `
                      <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                        <span>${it.quantity}x ${it.name}</span>
                        <span style="font-weight: 700;">₹${it.price * it.quantity}</span>
                      </div>
                    `).join('')}
                    <div style="border-top: 1px solid var(--card-border); margin-top: 6px; padding-top: 6px; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.9rem;">
                      <span>Total</span>
                      <span>₹${o.total}</span>
                    </div>
                  </div>

                  <div style="display: flex; gap: 8px;">
                    ${o.status === 'received' ? `
                      <button class="btn btn-primary" onclick="setOrderStatus('${o.id}', 'preparing')" style="flex:1; padding:7px; font-size:0.8rem;">🍳 Start Preparing</button>
                    ` : o.status === 'preparing' ? `
                      <button class="btn btn-emerald" onclick="setOrderStatus('${o.id}', 'ready')" style="flex:1; padding:7px; font-size:0.8rem;">🔔 Mark Ready</button>
                    ` : o.status === 'ready' ? `
                      <button class="btn btn-secondary" onclick="setOrderStatus('${o.id}', 'completed')" style="flex:1; padding:7px; font-size:0.8rem;">✅ Complete</button>
                    ` : `
                      <span style="font-size: 0.78rem; color: #64748b;">Completed</span>
                    `}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- Menu Management -->
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="font-size: 1.3rem; font-weight: 800;">Manage Menu Items (${liveProducts.length})</h2>
            <button class="btn btn-emerald" onclick="openAddProductModal()">+ Add Item</button>
          </div>

          <div class="grid">
            ${liveProducts.map(p => `
              <div class="product-card">
                <img src="${p.image_url}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'">
                <div class="product-info">
                  <div>
                    <h3 style="font-size: 1rem; font-weight: 800; color: #fff;">${p.name}</h3>
                    <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary); margin: 4px 0 10px 0;">₹${p.price}</div>
                  </div>
                  <button class="btn btn-secondary" onclick="deleteProduct('${p.id}')" style="color: #f87171; border-color: rgba(239,68,68,0.2); font-size: 0.75rem; padding: 5px 10px;">🗑️ Delete</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function changeShop(id) {
      currentShopId = id;
      localStorage.setItem('qr_active_shop', id);
      renderApp();
    }

    // -------------------------------------------------------------
    // CART & CHECKOUT LOGIC
    // -------------------------------------------------------------
    function addToCart(productId, name, price) {
      playAudio('click');
      const item = cart.find(i => i.product_id === productId);
      if (item) {
        item.quantity += 1;
      } else {
        cart.push({ product_id: productId, name, price, quantity: 1 });
      }
      updateCartBadge();
      showToast(`Added ${name} to cart`);
    }

    function updateCartBadge() {
      const totalQty = cart.reduce((s, i) => s + i.quantity, 0);
      const badge = document.getElementById('cartCountBadge');
      badge.innerText = totalQty;
      badge.style.display = totalQty > 0 ? 'inline-block' : 'none';
    }

    function openCart() {
      playAudio('click');
      const drawer = document.getElementById('cartDrawer');
      const list = document.getElementById('cartItemsList');
      const footer = document.getElementById('cartFooter');

      if (cart.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">Your cart is empty. Add delicious items to order!</div>`;
        footer.innerHTML = ``;
      } else {
        const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const tax = Math.round(subtotal * 0.05);
        const total = subtotal + tax;

        list.innerHTML = cart.map((it, idx) => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border);">
            <div>
              <div style="font-weight: 700; font-size: 0.92rem; color: #fff;">${it.name}</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">₹${it.price} each</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <button class="btn btn-secondary" style="padding: 2px 8px;" onclick="changeQty(${idx}, -1)">-</button>
              <span style="font-weight: 800; min-width: 18px; text-align: center;">${it.quantity}</span>
              <button class="btn btn-secondary" style="padding: 2px 8px;" onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `).join('');

        footer.innerHTML = `
          <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 14px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">
              <span>Subtotal</span><span>₹${subtotal}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">
              <span>GST (5%)</span><span>₹${tax}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 1.05rem; font-weight: 800; color: #fff; border-top: 1px solid var(--card-border); padding-top: 6px;">
              <span>Grand Total</span><span>₹${total}</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Table Number / Address</label>
            <input type="text" id="checkoutTableInput" class="form-input" value="Table 1">
          </div>

          <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;" onclick="submitOrder()">
            ⚡ Place Order (₹${total})
          </button>
        `;
      }

      drawer.style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cartDrawer').style.display = 'none';
    }

    function changeQty(idx, delta) {
      cart[idx].quantity += delta;
      if (cart[idx].quantity <= 0) {
        cart.splice(idx, 1);
      }
      updateCartBadge();
      openCart();
    }

    async function submitOrder() {
      if (cart.length === 0 || !currentShopId) return;
      const table = document.getElementById('checkoutTableInput').value || 'Table 1';

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            shop_id: currentShopId,
            customer_name: userProfile.name || 'Guest Customer',
            customer_phone: userProfile.phone || '',
            table_or_address: table,
            items: cart
          })
        });
        const order = await res.json();
        cart = [];
        updateCartBadge();
        closeCart();
        showToast(`🎉 Order ${order.order_number} confirmed!`);
        openProfile();
      } catch(e) {
        alert('Order placement failed');
      }
    }

    // -------------------------------------------------------------
    // PROFILE MODAL (NO COMPULSION)
    // -------------------------------------------------------------
    function openProfile() {
      playAudio('click');
      document.getElementById('profileInputName').value = userProfile.name || '';
      document.getElementById('profileInputPhone').value = userProfile.phone || '';
      document.getElementById('profileNameDisplay').innerText = userProfile.name || 'Guest User';
      document.getElementById('profileRoleBadge').innerText = currentRole === 'owner' ? '🏪 Shop Owner Mode' : '🛍️ Customer Mode';

      const details = document.getElementById('profileSectionDetails');
      if (currentRole === 'customer') {
        details.innerHTML = `
          <div style="border-top: 1px solid var(--card-border); padding-top: 14px;">
            <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;">Customer Preferences</div>
            <p style="font-size: 0.82rem; color: #64748b;">You can browse stores and place orders with zero registration compulsion. Save details above for quick auto-checkout.</p>
          </div>
        `;
      } else {
        details.innerHTML = `
          <div style="border-top: 1px solid var(--card-border); padding-top: 14px;">
            <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;">Owner Tools</div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-emerald" onclick="closeProfile(); openAddShopModal();" style="flex:1;">+ Register Store</button>
            </div>
          </div>
        `;
      }

      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfile() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function saveProfile(e) {
      e.preventDefault();
      userProfile.name = document.getElementById('profileInputName').value.trim();
      userProfile.phone = document.getElementById('profileInputPhone').value.trim();
      localStorage.setItem('qr_profile', JSON.stringify(userProfile));
      updateHeader();
      closeProfile();
      showToast('Profile saved successfully');
    }

    // -------------------------------------------------------------
    // STORE MODALS
    // -------------------------------------------------------------
    function openAddShopModal() {
      document.getElementById('addShopModal').style.display = 'flex';
    }
    function closeAddShopModal() {
      document.getElementById('addShopModal').style.display = 'none';
    }

    async function createShop(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('shopNameInput').value,
        category: document.getElementById('shopCategoryInput').value,
        tagline: document.getElementById('shopTaglineInput').value,
        phone: document.getElementById('shopPhoneInput').value,
        upi_id: document.getElementById('shopUpiInput').value,
        table_count: document.getElementById('shopTableCountInput').value
      };

      try {
        const res = await fetch('/api/shops', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const created = await res.json();
        currentShopId = created.id;
        localStorage.setItem('qr_active_shop', created.id);
        closeAddShopModal();
        showToast(`Store ${created.name} registered live!`);
        renderApp();
      } catch(err) {
        alert('Failed to register store');
      }
    }

    function showStoreQr(shopId, name) {
      const imgUrl = `/api/qr/${shopId}`;
      document.getElementById('qrImageTag').src = imgUrl;
      document.getElementById('qrStoreTitle').innerText = name;
      document.getElementById('qrDownloadBtn').href = imgUrl;
      document.getElementById('qrModal').style.display = 'flex';
    }
    function closeQrModal() {
      document.getElementById('qrModal').style.display = 'none';
    }

    async function toggleStoreStatus(shopId, isOpen) {
      await fetch(`/api/shops/${shopId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_open: isOpen })
      });
      showToast(`Store is now ${isOpen ? 'Open' : 'Closed'}`);
      renderApp();
    }

    // ── PRODUCTS & ORDERS ─────────────────────────────────────
    function openAddProductModal() {
      document.getElementById('addProductModal').style.display = 'flex';
    }
    function closeAddProductModal() {
      document.getElementById('addProductModal').style.display = 'none';
    }

    async function addProduct(e) {
      e.preventDefault();
      if (!currentShopId) return;

      const body = {
        name: document.getElementById('prodNameInput').value,
        price: parseFloat(document.getElementById('prodPriceInput').value),
        dietary: document.getElementById('prodDietaryInput').value,
        category: document.getElementById('prodCategoryInput').value || 'Main Course',
        prep_time: document.getElementById('prodPrepTimeInput').value || '15 min',
        image_url: document.getElementById('prodImageInput').value
      };

      await fetch(`/api/shops/${currentShopId}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      closeAddProductModal();
      showToast(`Added ${body.name} to menu`);
      renderApp();
    }

    async function deleteProduct(id) {
      if (confirm('Delete this dish from menu?')) {
        await fetch(`/api/products/${id}`, { method: 'DELETE' });
        showToast('Item removed');
        renderApp();
      }
    }

    async function setOrderStatus(orderId, status) {
      playAudio('success');
      await fetch(`/api/orders/${orderId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      showToast(`Order status updated to ${status}`);
      renderApp();
    }

    // Initialize
    updateHeader();
    renderApp();
  </script>
</body>
</html>
